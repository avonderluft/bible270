name: "Coveralls"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      # No SKIP_COV here: test_helper only loads simplecov/coveralls without it.
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Inspect coverage
        run: |
          ruby -rjson -e '
            r = JSON.parse(File.read("coverage/.resultset.json"))
            result = r.values.first
            files = result["coverage"]
            total = files.values.sum { |f| f["lines"].compact.count }
            covered = files.values.sum { |f| f["lines"].compact.count { |n| n && n > 0 } }
            puts "CI COVERAGE: #{covered} / #{total} = #{(covered.to_f / total * 100).round(2)}%"
          '

      - name: Report coverage to Coveralls
        run: bundle exec rake coveralls:push

      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
