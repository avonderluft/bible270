- id: deuteronomy-6-6-7
  reference: Deuteronomy 6:6-7
  translation: NASB95
  text: These words, which I am commanding you today, shall be on your heart. You shall teach them diligently to your sons and shall talk of them when you sit in your house and when you walk by the way and when you lie down and when you rise up.
  attribution: NASB 1995 © The Lockman Foundation.
- id: deuteronomy-11-18
  reference: Deuteronomy 11:18
  translation: NKJV
  text: Therefore you shall lay up these words of mine in your heart and in your soul, and bind them as a sign on your hand, and they shall be as frontlets between your eyes.
  attribution: NKJV © 1982 Thomas Nelson.
- id: deuteronomy-30-14
  reference: Deuteronomy 30:14
  translation: ESV
  text: But the word is very near you. It is in your mouth and in your heart, so that you can do it.
  attribution: ESV © 2001 Crossway.
- id: psalm-1-1-2
  reference: Psalm 1:1-2
  translation: NASB95
  text: |-
    How blessed is the man who does not walk in the counsel of the wicked,
    Nor stand in the path of sinners,
    Nor sit in the seat of scoffers!
    But his delight is in the law of the LORD,
    And in His law he meditates day and night.
  attribution: NASB 1995 © The Lockman Foundation.
- id: psalm-19-8
  reference: Psalm 19:8
  translation: NKJV
  text: |-
    The statutes of the LORD are right, rejoicing the heart;
    The commandment of the LORD is pure, enlightening the eyes.
  attribution: NKJV © 1982 Thomas Nelson.
- id: psalm-86-11-13
  reference: Psalm 86:11-13
  translation: ESV
  text: |-
    Teach me your way, O LORD, that I may walk in your truth;
    unite my heart to fear your name.
    I give thanks to you, O Lord my God, with my whole heart,
    and I will glorify your name forever.
    For great is your steadfast love toward me;
    you have delivered my soul from the depths of Sheol.
  attribution: ESV © 2001 Crossway.
- id: psalm-107-20
  reference: Psalm 107:20
  translation: NKJV
  text: |-
    He sent His word and healed them,
    And delivered them from their destructions.
  attribution: NKJV © 1982 Thomas Nelson.
- id: psalm-119-9
  reference: Psalm 119:9
  translation: NASB95
  text: |-
    How can a young man keep his way pure?
    By keeping it according to Your word.
  attribution: NASB 1995 © The Lockman Foundation.
- id: psalm-119-11
  reference: Psalm 119:11
  translation: NASB95
  text: |-
    Your word I have treasured in my heart,
    That I may not sin against You.
  attribution: NASB 1995 © The Lockman Foundation.
- id: psalm-119-47
  reference: Psalm 119:47
  translation: NKJV
  text: |-
    I will delight myself in Your commandments,
    Which I love.
  attribution: NKJV © 1982 Thomas Nelson.
- id: psalm-119-103
  reference: Psalm 119:103
  translation: NASB95
  text: |-
    How sweet are Your words to my taste!
    Yes, sweeter than honey to my mouth!
  attribution: NASB 1995 © The Lockman Foundation.
- id: psalm-119-105
  reference: Psalm 119:105
  translation: NKJV
  text: |-
    Your word is a lamp to my feet
    And a light to my path.
  attribution: NKJV © 1982 Thomas Nelson.
- id: psalm-119-130
  reference: Psalm 119:130
  translation: NASB95
  text: |-
    The unfolding of Your words gives light;
    It gives understanding to the simple.
  attribution: NASB 1995 © The Lockman Foundation.
- id: psalm-119-162
  reference: Psalm 119:162
  translation: NASB95
  text: |-
    I rejoice at Your word,
    As one who finds great spoil.
  attribution: NASB 1995 © The Lockman Foundation.
  id: proverbs-4-20-22
  reference: Proverbs 4:20-22
  translation: NASB95
  text: |-
    My son, give attention to my words;
    Incline your ear to my sayings.
    Do not let them depart from your sight;
    Keep them in the midst of your heart.
    For they are life to those who find them
    And health to all their body.
  attribution: NASB 1995 © The Lockman Foundation.
- id: proverbs-6-23
  reference: Proverbs 6:23
  translation: NASB95
  text: |-
    For the commandment is a lamp and the teaching is light;
    And reproofs for discipline are the way of life
  attribution: NASB 1995 © The Lockman Foundation.
- id: proverbs-16-20
  reference: Proverbs 16:20
  translation: NASB95
  text: |-
    He who gives attention to the word will find good,
    And blessed is he who trusts in the LORD.
  attribution: NASB 1995 © The Lockman Foundation.
- id: isaiah-40-7-8
  reference: Isaiah 40:7-8
  translation: NASB95
  text: |-
    The grass withers, the flower fades,
    When the breath of the LORD blows upon it;
    Surely the people are grass.
    The grass withers, the flower fades,
    But the word of our God stands forever.
  attribution: NASB 1995 © The Lockman Foundation.
- id: isaiah-55-11
  reference: Isaiah 55:11
  translation: ESV
  text: |-
    so shall my word be that goes out from my mouth;
    it shall not return to me empty,
    but it shall accomplish that which I purpose,
    and shall succeed in the thing for which I sent it.
  attribution: ESV © 2001 Crossway.
- id: isaiah-66-2
  reference: Isaiah 66:2
  translation: ESV
  text: |-
    All these things my hand has made,
    and so all these things came to be, declares the LORD.
    But this is the one to whom I will look:
    he who is humble and contrite in spirit
    and trembles at my word.
  attribution: ESV © 2001 Crossway.
- id: jeremiah-15-16
  reference: Jeremiah 15:16
  translation: NASB95
  text: |-
    Your words were found and I ate them,
    And Your words became for me a joy and the delight of my heart;
    For I have been called by Your name,
    O LORD God of hosts.
  attribution: NASB 1995 © The Lockman Foundation.
- id: jeremiah-23-29
  reference: Jeremiah 23:29
  translation: NKJV
  text: |-
    “Is not My word like a fire?” says the LORD,
    “And like a hammer that breaks the rock in pieces?
  attribution: NKJV © 1982 Thomas Nelson.
